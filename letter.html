<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open the Letter — Birthday Universe</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="letter">
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-particles" id="particles"></div>
    <div class="bg-stars" id="stars"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Birthday Universe home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-text">Birthday&nbsp;Universe</span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="index.html" class="nav-link" data-nav="home">Home</a>
      <a href="letter.html" class="nav-link" data-nav="letter">Letter</a>
      <a href="celebration.html" class="nav-link" data-nav="celebration">Celebration</a>
      <a href="create.html" class="nav-link" data-nav="create">Create</a>
    </nav>
    <div class="audio-controls" id="audio-controls"></div>
  </header>

  <main class="page-main">
    <section class="letter-section" aria-labelledby="letter-title">
      <h1 id="letter-title" class="section-title">A Letter For You</h1>
      <p class="section-subtitle">Tap the envelope to open it.</p>

      <div class="envelope-stage" id="envelope-stage">
        <button class="envelope" id="envelope" aria-label="Open the letter" aria-expanded="false">
          <span class="envelope-back"></span>
          <span class="envelope-letter" id="envelope-letter">
            <span class="letter-line">Dear <span id="letter-to" class="accent">Friend</span>,</span>
            <span class="letter-line" id="letter-message">Happy Birthday! May this year bring you joy, magic, and everything you wish for.</span>
            <span class="letter-line letter-sign">— <span id="letter-from">Someone who cares</span></span>
          </span>
          <span class="envelope-flap"></span>
          <span class="envelope-front"></span>
          <span class="envelope-seal" aria-hidden="true">♥</span>
        </button>
      </div>

      <div class="letter-actions">
        <button class="btn btn-ghost" id="reopen-letter" type="button">Reopen Letter</button>
        <a href="celebration.html" class="btn btn-primary">Next: Celebrate</a>
      </div>
      <p class="live-region" id="letter-status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made with ✨ for someone special.</p>
  </footer>

  <script src="js/effects.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/birthday-card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
