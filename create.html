<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Your Card — Birthday Universe</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="create">
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-particles" id="particles"></div>
    <div class="bg-stars" id="stars"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Birthday Universe home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-text">Birthday&nbsp;Universe</span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="index.html" class="nav-link" data-nav="home">Home</a>
      <a href="letter.html" class="nav-link" data-nav="letter">Letter</a>
      <a href="celebration.html" class="nav-link" data-nav="celebration">Celebration</a>
      <a href="create.html" class="nav-link" data-nav="create">Create</a>
    </nav>
    <div class="audio-controls" id="audio-controls"></div>
  </header>

  <main class="page-main">
    <section class="create-section" aria-labelledby="create-title">
      <h1 id="create-title" class="section-title">Create Your Card</h1>
      <p class="section-subtitle">Personalize it, then share the link.</p>

      <div class="create-layout">
        <form class="card-form glass" id="card-form" novalidate>
          <div class="field">
            <label for="to">Recipient name</label>
            <input type="text" id="to" name="to" maxlength="40" placeholder="e.g. Andi" required />
          </div>
          <div class="field">
            <label for="message">Birthday message</label>
            <textarea id="message" name="message" maxlength="240" rows="4" placeholder="Write something heartfelt..." required></textarea>
            <p class="hint"><span id="message-count">0</span>/240</p>
          </div>
          <div class="field">
            <label for="from">Sender name</label>
            <input type="text" id="from" name="from" maxlength="40" placeholder="e.g. Sahabat" required />
          </div>
          <fieldset class="field">
            <legend>Theme</legend>
            <div class="theme-options" role="radiogroup" aria-label="Theme">
              <label class="theme-swatch"><input type="radio" name="theme" value="dreamy" checked /><span class="swatch swatch-dreamy"></span><span>Dreamy</span></label>
              <label class="theme-swatch"><input type="radio" name="theme" value="rose" /><span class="swatch swatch-rose"></span><span>Rose</span></label>
              <label class="theme-swatch"><input type="radio" name="theme" value="ocean" /><span class="swatch swatch-ocean"></span><span>Ocean</span></label>
              <label class="theme-swatch"><input type="radio" name="theme" value="gold" /><span class="swatch swatch-gold"></span><span>Gold</span></label>
            </div>
          </fieldset>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Generate Link</button>
            <button type="button" class="btn btn-ghost" id="reset-form">Reset</button>
          </div>
          <p class="live-region" id="form-status" aria-live="polite"></p>
        </form>

        <aside class="preview-pane" aria-labelledby="preview-title">
          <h2 id="preview-title" class="preview-heading">Live Preview</h2>
          <div class="preview-card tilt" id="live-preview">
            <div class="preview-card-inner">
              <p class="preview-label">A card for</p>
              <h3 class="preview-title" id="preview-to">Friend</h3>
              <p class="preview-text" id="preview-message">Your message will appear here.</p>
              <p class="preview-from">— <span id="preview-from">Sender</span></p>
            </div>
          </div>
          <div class="share-box">
            <label for="share-link">Share link</label>
            <input type="text" id="share-link" readonly placeholder="Generate a link first" />
            <div class="share-actions">
              <button class="btn btn-primary" id="copy-link" type="button">Copy Link</button>
              <a class="btn btn-ghost" id="open-link" href="letter.html" target="_blank" rel="noopener">Open</a>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made with ✨ for someone special.</p>
  </footer>

  <script src="js/effects.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/birthday-card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
